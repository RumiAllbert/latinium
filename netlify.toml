[build]
command = "npm run build"
publish = "dist"

# Simple fallback for SPA routing
[[redirects]]
from = "/graph"
to = "/graph/index.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build.environment]
# Node 18/20 are EOL and do not receive CVE-2026-111497. Use 22.x.
NODE_VERSION = "22"
# Explicitly make sure environment variables are processed during build
NETLIFY_USE_CREDENTIALS = "true"

[dev]
framework = "astro"
targetPort = 4321
